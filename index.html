<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة حسابات الشركات</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f8;
    color: #222;
}

/* ================= LOGIN ================= */

#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #17365d;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.2);
    text-align: center;
}

.login-box h1 {
    color: #17365d;
    margin-bottom: 10px;
}

.login-box p {
    color: #777;
    margin-bottom: 25px;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    text-align: right;
}

.login-box input:focus {
    outline: none;
    border-color: #17365d;
}

.login-box button {
    width: 100%;
    border: none;
    background: #17365d;
    color: white;
    padding: 13px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.login-box button:hover {
    background: #0f2744;
}

#errorMessage {
    color: #c0392b;
    margin-top: 15px;
    display: none;
}

/* ================= SYSTEM ================= */

#systemPage {
    display: none;
}

header {
    background: #17365d;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    font-size: 24px;
}

header p {
    margin-top: 8px;
    opacity: 0.85;
}

header button {
    margin-top: 15px;
    background: white;
    color: #17365d;
}

header button:hover {
    background: #e8edf2;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h3 {
    color: #666;
    font-size: 15px;
    margin-bottom: 10px;
}

.card strong {
    font-size: 24px;
    color: #17365d;
}

.section {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.section-header h2 {
    color: #17365d;
}

button {
    border: none;
    background: #17365d;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #0f2744;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 13px;
    border-bottom: 1px solid #eee;
    text-align: right;
}

th {
    background: #f4f6f8;
    color: #555;
}

.balance {
    font-weight: bold;
    color: #c0392b;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
    font-size: 13px;
}

@media (max-width: 700px) {

    .cards {
        grid-template-columns: 1fr;
    }

    .section {
        overflow-x: auto;
    }

    table {
        min-width: 600px;
    }

    header h1 {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN PAGE ================= -->

<div id="loginPage">

    <div class="login-box">

        <h1>مهيم</h1>

        <p>نظام إدارة حسابات الشركات</p>

        <input
            type="text"
            id="username"
            placeholder="اسم المستخدم"
        >

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
        >

        <button onclick="login()">
            تسجيل الدخول
        </button>

        <div id="errorMessage">
            اسم المستخدم أو كلمة المرور غير صحيحة
        </div>

    </div>

</div>


<!-- ================= SYSTEM PAGE ================= -->

<div id="systemPage">

<header>

    <h1>نظام إدارة حسابات الشركات</h1>

    <p>إدارة المشتريات والسداد والأرصدة</p>

    <button onclick="logout()">
        تسجيل الخروج
    </button>

</header>


<div class="container">

    <div class="cards">

        <div class="card">
            <h3>عدد الشركات</h3>
            <strong id="companiesCount">0</strong>
        </div>

        <div class="card">
            <h3>إجمالي المشتريات</h3>
            <strong>25,000 ريال</strong>
        </div>

        <div class="card">
            <h3>إجمالي المديونية</h3>
            <strong>12,500 ريال</strong>
        </div>

    </div>


    <div class="section">

        <div class="section-header">

            <h2>الشركات</h2>

            <button onclick="addCompany()">
                + إضافة شركة
            </button>

        </div>


        <table>

            <thead>

                <tr>
                    <th>الشركة</th>
                    <th>المشتريات</th>
                    <th>السداد</th>
                    <th>الرصيد</th>
                </tr>

            </thead>


            <tbody id="companiesTable"></tbody>

        </table>

    </div>

</div>


<footer>
    © 2026 — نظام إدارة حسابات الشركات
</footer>

</div>


<script>

/* ================= LOGIN ================= */

function login() {

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (username === "admin" && password === "1234") {

        localStorage.setItem("mahimmLoggedIn", "true");

        document.getElementById("loginPage").style.display = "none";
        document.getElementById("systemPage").style.display = "block";

        loadCompanies();

    } else {

        document.getElementById("errorMessage").style.display = "block";

    }
}


/* ================= CHECK LOGIN ================= */

window.onload = function () {

    const loggedIn = localStorage.getItem("mahimmLoggedIn");

    if (loggedIn === "true") {

        document.getElementById("loginPage").style.display = "none";
        document.getElementById("systemPage").style.display = "block";

        loadCompanies();

    } else {

        document.getElementById("loginPage").style.display = "flex";
        document.getElementById("systemPage").style.display = "none";

    }

};


/* ================= INITIAL COMPANIES ================= */

function initializeCompanies() {

    const existingCompanies = localStorage.getItem("mahimmCompanies");

    if (!existingCompanies) {

        const companies = [

            {
                name: "شركة المثال الأولى",
                purchases: 10000,
                payments: 6000
            },

            {
                name: "شركة المثال الثانية",
                purchases: 8000,
                payments: 3000
            },

            {
                name: "شركة المثال الثالثة",
                purchases: 7000,
                payments: 3500
            }

        ];

        localStorage.setItem(
            "mahimmCompanies",
            JSON.stringify(companies)
        );
    }
}


/* ================= LOAD COMPANIES ================= */

function loadCompanies() {

    initializeCompanies();

    const companies =
        JSON.parse(localStorage.getItem("mahimmCompanies")) || [];

    const table =
        document.getElementById("companiesTable");

    table.innerHTML = "";

    companies.forEach(function(company) {

        const balance =
            company.purchases - company.payments;

        const row =
            document.createElement("tr");

        row.innerHTML = `
            <td>${company.name}</td>
            <td>${company.purchases.toLocaleString()} ريال</td>
            <td>${company.payments.toLocaleString()} ريال</td>
            <td class="balance">
                ${balance.toLocaleString()} ريال
            </td>
        `;

        table.appendChild(row);

    });

    document.getElementById("companiesCount").textContent =
        companies.length;
}


/* ================= ADD COMPANY ================= */

function addCompany() {

    const companyName =
        prompt("أدخل اسم الشركة:");

    if (!companyName || companyName.trim() === "") {
        return;
    }

    const companies =
        JSON.parse(localStorage.getItem("mahimmCompanies")) || [];

    companies.push({

        name: companyName.trim(),

        purchases: 0,

        payments: 0

    });

    localStorage.setItem(
        "mahimmCompanies",
        JSON.stringify(companies)
    );

    loadCompanies();

    alert("تمت إضافة الشركة بنجاح");

}


/* ================= LOGOUT ================= */

function logout() {

    localStorage.removeItem("mahimmLoggedIn");

    document.getElementById("systemPage").style.display = "none";
    document.getElementById("loginPage").style.display = "flex";

}

</script>

</body>
</html>
